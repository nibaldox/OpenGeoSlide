name: wheels

# Wheels abi3 (cp311-abi3: un wheel por plataforma sirve para CPython >= 3.11) y sdist.
# Con un tag v*, los wheels y el sdist se suben como assets del GitHub Release del tag (job `release-assets`).
#
# PyPI está DESACTIVADO por ahora (no hay cuenta). El job `publish` solo corre si la variable de repositorio
# `PYPI_PUBLISH` vale 'true'. Para activarlo:
#   1. Crear la cuenta en PyPI y registrar el proyecto `opengeoslide` (o un pending publisher).
#   2. Configurar Trusted Publishing en PyPI: propietario `nibaldox`, repositorio `opengeoslide`, workflow
#      `wheels.yml`, environment `pypi`.
#   3. Crear el environment `pypi` en Settings > Environments del repositorio.
#   4. Definir la variable en Settings > Secrets and variables > Actions > Variables: PYPI_PUBLISH = true.
# Sin la variable, el release no falla: el job `publish` se omite y el Release conserva los wheels.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'crates/ogs-py/**'
      - 'crates/ogs-core/**'
      - '.github/workflows/wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: '2014', smoke: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, smoke: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # LICENSE y NOTICE viven en la raíz; PEP 639 no admite `..`, así que se copian junto al pyproject.toml.
      - name: Copiar LICENSE y NOTICE junto a pyproject.toml
        shell: bash
        run: crates/ogs-py/scripts/prepare-license-files.sh
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: crates/ogs-py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # `--compatibility pypi` rechaza etiquetas que PyPI no acepta (p. ej. manylinux_2_35).
          args: --release --locked --compatibility pypi -i python3.13 --out dist
          sccache: 'true'
      - name: Comprobar que el wheel instala e importa
        if: ${{ matrix.smoke }}
        shell: bash
        run: |
          python -m pip install --no-index --find-links crates/ogs-py/dist opengeoslide
          python -c "import opengeoslide; print('opengeoslide', opengeoslide.__file__)"
      # La suite de crates/ogs-py/tests se ejecuta contra el wheel instalado (no contra el árbol de fuentes) y,
      # como el wheel es de producción, exige que no exponga los ganchos de prueba (OGS_PY_TEST_HOOKS=0).
      - name: pytest de crates/ogs-py/tests contra el wheel instalado
        if: ${{ matrix.smoke }}
        shell: bash
        env:
          OGS_PY_TEST_HOOKS: '0'
        run: |
          python -m pip install pytest
          python -c "import opengeoslide, sys; assert 'site-packages' in opengeoslide.__file__, opengeoslide.__file__"
          python -m pytest crates/ogs-py/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: crates/ogs-py/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copiar LICENSE y NOTICE junto a pyproject.toml
        run: crates/ogs-py/scripts/prepare-license-files.sh
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/ogs-py
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: crates/ogs-py/dist/*.tar.gz
          if-no-files-found: error

  release-assets:
    name: wheels en el GitHub Release
    needs: [wheels, sdist]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # solo este job sube assets al Release (lo crea release.yml)
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - run: ls -l dist
      - name: Comprobar que hay wheels y sdist
        run: |
          ls dist/*.whl dist/*.tar.gz
      # release.yml es el ÚNICO que crea el Release; aquí solo se esperan y se suben los assets.
      - name: Esperar a que release.yml cree el Release del tag
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME encontrado."
              exit 0
            fi
            echo "Esperando el Release $GITHUB_REF_NAME ($i/60)..."
            sleep 20
          done
          echo "::error::El Release $GITHUB_REF_NAME no apareció tras 20 min. Revise que release.yml (job github-release) se haya ejecutado y creado el Release." >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Subir wheels y sdist al Release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish:
    name: publicar en PyPI
    needs: [wheels, sdist]
    # Desactivado salvo que la variable de repositorio PYPI_PUBLISH sea 'true' (ver el encabezado del archivo).
    if: ${{ vars.PYPI_PUBLISH == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/opengeoslide/
    permissions:
      contents: read
      id-token: write # Trusted Publishing: PyPI intercambia el OIDC por un token de 15 minutos
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
