<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Un motor, cuatro formas de usarlo</title>
  <desc id="d">Diagrama: el motor ogs-core, escrito en Rust, calcula Bishop y Spencer y alimenta la aplicación web (WebAssembly y PWA), el paquete Python opengeoslide y la CLI ogs. Las tres leen y escriben el mismo formato de modelo .ogs.json.</desc>
  <rect width="1200" height="400" rx="26" fill="#12324a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="56" y="76" font-size="44" font-weight="700" fill="#f8f1df">Un motor, cuatro formas de usarlo</text>

    <g stroke="#d9b97c" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M600 200 V235"/>
      <path d="M181 235 H1019"/>
      <path d="M181 235 V272"/>
      <path d="M460.3 235 V272"/>
      <path d="M739.7 235 V272"/>
      <path d="M1019 235 V272" stroke-dasharray="2 9"/>
    </g>

    <rect x="216" y="108" width="768" height="92" rx="14" fill="#c9a66b"/>
    <text x="248" y="170" font-size="54" font-weight="700" fill="#12324a">ogs-core</text>
    <text x="520" y="164" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#12324a">Rust · Bishop · Spencer</text>

    <g id="web">
      <rect x="56" y="272" width="250" height="100" rx="14" fill="#0d2a40" stroke="#5b7a93" stroke-width="2"/>
      <text x="80" y="318" font-size="38" font-weight="700" fill="#f8f1df">Web</text>
      <text x="80" y="352" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#cbd5e1">WASM · PWA</text>
    </g>
    <g id="python">
      <rect x="335.3" y="272" width="250" height="100" rx="14" fill="#0d2a40" stroke="#5b7a93" stroke-width="2"/>
      <text x="359.3" y="318" font-size="38" font-weight="700" fill="#f8f1df">Python</text>
      <text x="359.3" y="352" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#cbd5e1">opengeoslide</text>
    </g>
    <g id="cli">
      <rect x="614.7" y="272" width="250" height="100" rx="14" fill="#0d2a40" stroke="#5b7a93" stroke-width="2"/>
      <text x="638.7" y="318" font-size="38" font-weight="700" fill="#f8f1df">CLI</text>
      <text x="638.7" y="352" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#cbd5e1">ogs analyze</text>
    </g>
    <g id="format">
      <rect x="894" y="272" width="250" height="100" rx="14" fill="none" stroke="#d9b97c" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="918" y="318" font-size="34" font-weight="700" fill="#f8f1df">.ogs.json</text>
      <text x="918" y="352" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#cbd5e1">formato común</text>
    </g>
  </g>
</svg>
