  <title id="t">OpenGeoSlide: estabilidad de taludes 2D por equilibrio límite</title>
  <desc id="d">Sección transversal del caso ACADS 1(a), un talud homogéneo de 10 m con la superficie de falla circular crítica y sus 51 dovelas, calculadas por el motor: Bishop 0,985 y Spencer 0,984; el valor publicado es 0,987.</desc>
