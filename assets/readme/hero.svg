    <text x="54" y="170" font-size="72" font-weight="700" fill="#f8f1df">OpenGeoSlide</text>
    <text x="56" y="222" font-size="24" fill="#cbd5e1">Factor de seguridad de taludes con</text>
    <text x="56" y="254" font-size="24" fill="#cbd5e1">Bishop y Spencer, en el navegador o</text>
    <text x="56" y="286" font-size="24" fill="#cbd5e1">en su equipo. Libre y verificado.</text>
