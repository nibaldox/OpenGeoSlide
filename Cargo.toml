[workspace]
resolver = "3"
members = ["crates/ogs-core", "crates/ogs-cli", "crates/ogs-wasm", "crates/ogs-py"]
default-members = ["crates/ogs-core", "crates/ogs-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Colaboradores de OpenGeoSlide"]
repository = "https://github.com/nibaldox/OpenGeoSlide"
homepage = "https://nibaldox.github.io/OpenGeoSlide/"
documentation = "https://docs.rs/ogs-core"
readme = "README.md"
keywords = ["geotechnics", "slope-stability", "limit-equilibrium", "bishop", "spencer"]
categories = ["science", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
