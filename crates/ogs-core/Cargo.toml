[package]
name = "ogs-core"
description = "Motor de estabilidad de taludes 2D por equilibrio límite (OpenGeoSlide)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
