[package]
name = "ogs-cli"
description = "CLI de OpenGeoSlide (binario `ogs`)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ogs"
path = "src/main.rs"

[features]
# Rayon grid search in ogs-core (native only). Used by bench/run_all.sh for the `native-parallel` target.
parallel = ["ogs-core/parallel"]

[dependencies]
ogs-core = { version = "0.3.0", path = "../ogs-core" }
serde_json = "1"
