[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "opengeoslide"
dynamic = ["version"]
description = "Motor de estabilidad de taludes 2D por equilibrio límite (OpenGeoSlide)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[tool.maturin]
module-name = "opengeoslide._core"
python-source = "python"
