[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "opengeoslide"
dynamic = ["version"]
description = "Motor de estabilidad de taludes 2D por equilibrio límite (OpenGeoSlide)"
readme = "README.md"
license = "Apache-2.0"
# PEP 639: las rutas son relativas a este pyproject.toml y no admiten «..». LICENSE y NOTICE viven en la raíz del
# repositorio; scripts/prepare-license-files.sh los copia aquí antes de construir (las copias no se versionan).
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Colaboradores de OpenGeoSlide" }]
keywords = ["geotechnics", "slope-stability", "limit-equilibrium", "bishop", "spencer", "rust"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://nibaldox.github.io/OpenGeoSlide/"
Repository = "https://github.com/nibaldox/OpenGeoSlide"
Issues = "https://github.com/nibaldox/OpenGeoSlide/issues"
Changelog = "https://github.com/nibaldox/OpenGeoSlide/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "opengeoslide._core"
python-source = "python"
