[package]
name = "ogs-wasm"
description = "Wrapper WebAssembly de ogs-core (wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exposes `panicForTests` for the panic-path smoke test. Off by default; not used by the web build.
test-hooks = []

[dependencies]
ogs-core = { version = "0.5.1", path = "../ogs-core" }
# Must match the wasm-bindgen CLI installed on the machine (0.2.130).
wasm-bindgen = "=0.2.130"
