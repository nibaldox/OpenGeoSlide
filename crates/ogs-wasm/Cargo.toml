[package]
name = "ogs-wasm"
description = "Wrapper WebAssembly de ogs-core (wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ogs-core = { path = "../ogs-core" }
# Must match the wasm-bindgen CLI installed on the machine (0.2.130).
wasm-bindgen = "=0.2.130"
