<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenGeoSlide: análisis de estabilidad de taludes 2D (Bishop y Spencer)" />
    <meta name="theme-color" content="#eceef1" data-scheme="light" data-color="#eceef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" data-scheme="dark" data-color="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark" />
    <!-- Arranque sin destello: oscuro por defecto; solo la elección guardada «light» lo cambia (ogs.theme.v1). Sin type=module ni defer. -->
    <script>
      (function () {
        var d = document, p = 'dark';
        try {
          if (localStorage.getItem('ogs.theme.v1') === 'light') p = 'light';
        } catch (e) {}
        d.documentElement.setAttribute('data-theme', p);
        var s = d.querySelector('meta[name="color-scheme"]');
        if (s) s.setAttribute('content', p);
        var m = d.querySelectorAll('meta[name="theme-color"]'), c = '', i;
        for (i = 0; i < m.length; i++) if (m[i].getAttribute('data-scheme') === p) c = m[i].getAttribute('data-color');
        if (c) for (i = 0; i < m.length; i++) m[i].setAttribute('content', c);
      })();
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>OpenGeoSlide: estabilidad de taludes 2D</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/pwa/register.ts"></script>
  </body>
</html>
