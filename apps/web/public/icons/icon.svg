<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OpenGeoSlide">
  <!-- Icono propio: perfil de un talud con una superficie de falla circular. Contenido dentro de la zona segura (80 %) para «maskable». -->
  <rect width="512" height="512" fill="#12324a"/>
  <!-- terreno: meseta a la izquierda, talud inclinado y pie a la derecha -->
  <path d="M86 214 H214 L376 352 H426 V400 H86 Z" fill="#c9a66b"/>
  <path d="M86 214 H214 L376 352 H426" fill="none" stroke="#f4e3bd" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- superficie de falla circular -->
  <path d="M170 214 A150 150 0 0 0 338 322" fill="none" stroke="#ff6b4a" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 0"/>
  <!-- cuña deslizante sombreada -->
  <path d="M170 214 H214 L338 322 A150 150 0 0 1 170 214 Z" fill="#ff6b4a" fill-opacity="0.28"/>
</svg>
